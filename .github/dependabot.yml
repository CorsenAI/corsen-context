version: 2
updates:
  # Composer tooling of the WordPress plugin: security updates only.
  - package-ecosystem: 'composer'
    directory: '/packages/wordpress-plugin/corsen-context'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
