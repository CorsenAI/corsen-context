  CORSEN_CONTEXT_REPOSITORY_URL = "https://github.com/CorsenAI/corsen-context-netlify"
  CORSEN_CONTEXT_LLMS_FULL_TXT_ENABLED = "false"

[functions]
  node_bundler = "esbuild"
